name: Deploy Expo Web App

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1️⃣ Vérifier le code depuis le repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Ajuste selon ta version

      # 3️⃣ Installer Expo CLI
      - name: Install Expo CLI
        run: npm install -g expo-cli

      # 4️⃣ Installer les dépendances du projet
      - name: Install dependencies
        run: npm install

      # 5️⃣ Build Expo Web
      - name: Build Expo Web App
        run: npx expo export -p web

      # 6️⃣ Déployer le build dans le dossier  cible sur le serveur Windows
      - name: Deploy to Web Server Directory
        run: |
          $targetFolder = "D:\blinker-web"
          if (-not (Test-Path $targetFolder)) {
            New-Item -ItemType Directory -Path $targetFolder
          }
          Copy-Item -Path ".\dist\*" -Destination $targetFolder -Recurse -Force
        shell: powershell

      # 7️⃣ (Facultatif) Redémarrer le serveur pour servir l'Expo Web
      - name: Restart Expo Web Server
        run: |
          Stop-Process -Name "expo" -Force -ErrorAction SilentlyContinue
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "expo serve --port 8013 --non-interactive --web-only"
        shell: powershell
