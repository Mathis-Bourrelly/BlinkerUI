name: Deploy Expo Web App

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1️⃣ Vérifier le code depuis le repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Ajuste selon ta version de Node.js

      # 3️⃣ Installer Expo CLI globalement
      - name: Install Expo CLI
        run: npm install -g expo-cli

      # 4️⃣ Installer les dépendances du projet
      - name: Install dependencies
        run: npm install

      # 5️⃣ Build Expo Web
      - name: Build the web app
        run: npx expo export:web

      # 6️⃣ Déploiement dans le dossier cible sur le serveur
      - name: Deploy to web server directory
        run: |
          $targetFolder = "D:\blinker-web"
          if (-not (Test-Path $targetFolder)) {
            New-Item -ItemType Directory -Path $targetFolder
          }
          Copy-Item -Path ".\web-build\*" -Destination $targetFolder -Recurse -Force
        shell: powershell

      # 7️⃣ (Facultatif) Redémarrer le serveur web
      - name: Restart Web Server
        run: |
          Stop-Process -Name "serve" -Force -ErrorAction SilentlyContinue
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "serve -s D:\blinker-web -l 3000"
        shell: powershell
