# Apache configuration for WebSocket proxying

# Enable required modules
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

# Virtual Host configuration for app.dev.blinker.eterny.fr
<VirtualHost *:443>
    ServerName app.dev.blinker.eterny.fr
    
    # Your existing SSL configuration
    # SSLEngine on
    # SSLCertificateFile /path/to/your/certificate.crt
    # SSLCertificateKeyFile /path/to/your/private.key
    # SSLCertificateChainFile /path/to/your/chain.crt
    
    # WebSocket proxy for socket.io
    ProxyPass /socket.io/ wss://dev.blinker.eterny.fr/socket.io/
    ProxyPassReverse /socket.io/ wss://dev.blinker.eterny.fr/socket.io/
    
    # Special handling for WebSocket upgrade
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) wss://dev.blinker.eterny.fr/socket.io/$1 [P,L]
    
    # Your existing proxy configuration for the main application
    # ProxyPass / http://localhost:your_port/
    # ProxyPassReverse / http://localhost:your_port/
    
    # Additional headers for WebSocket
    <Location /socket.io/>
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
    </Location>
</VirtualHost>
